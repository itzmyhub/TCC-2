# Metadados do roadmap — use com CHECKLIST_OBJETIVO_FINAL.md
# Convenção: done = false até marcar true ao concluir (agentes podem atualizar este arquivo)

meta:
  title: "Objetivo final TCC — tarefas rastreáveis"
  companion_md: "CHECKLIST_OBJETIVO_FINAL.md"
  objective: "Base enriquecida, modelos ≥ meta acadêmica, app/map alinhados, doc reprodutível"
  last_agent_run: "2026-05-14"
  avancos_doc: "scripts/AVANCOS_TREINAMENTO_RECENTES.md"
  metodologia_resultados: "DOCUMENTO_METODOLOGIA_E_RESULTADOS.md"
  decisao_metodologica_2026_05_10: |
    Substituição da feature 'Umidade' (NASA POWER, ~16 dias de enriquecimento)
    por 24 features físico-climáticas derivadas (Tier 1: SPI, KBDI proxy, MAs
    estendidas, lags, anomalias, histórico estendido). Embasamento na literatura
    (Seager 2015; Forests 2024 Cerrado-Amazônia; npj Nat. Hazards 2025).
    Resultado RF balanced: +4.47pp accuracy, +4.29pp F1-macro. Stacking: +3.11pp acc, +6.70pp F1-Moderado.
  decisao_ux_2026_05_11: |
    App interativo refatorado com UI explicável:
      - feature_lookup.py: medianas das 24 features Tier 1 pré-computadas (3 níveis: célula 0,25° / Estado-Mes / Mes-global) usadas em predição pontual.
      - explainer.py: contribuição local = importância_global × z-score × sinal_físico. Importâncias-padrão Tier 1 calibradas pela literatura.
      - Painel lateral 420px com 6 cards (Previsão, Por que esse risco?, Dados climáticos, Índices de seca, Acumulados + anomalia, Histórico de focos).
      - Smoke-tests confirmam que features Tier 1 entram corretamente na explicação em zonas de fogo (PA Sul: SPI/KBDI/Temp no top-6).
  decisao_thresholds_2026_05_11: |
    Threshold tuning multi-classe sobre Stacking Tier 1 persistido e integrado:
      - ajustar_threshold.py varre thr_moderado/thr_muito_alto em 50k amostras estratificadas e identifica best F1-macro e best F1-Moderado.
      - modelos/prediction_thresholds.json grava thresholds otimizados + baseline argmax.
      - app_map_interativo.py carrega o JSON em runtime; /api/predict aceita estrategia_thresholds (default f1_macro).
      - Ganho: F1-macro 0.7878 → 0.7894 (+0.16pp); F1-Moderado 0.6153 → 0.6270 (+1.17pp); acurácia preservada (-0.13 a -0.50pp).
  decisao_otimizacao_2026_05_12: |
    Optuna XGB + LightGBM + meta-learner GBM no Stacking:
      - otimizar_hiperparametros.py estendido para xgboost_classifier e lightgbm_classifier (15 trials cada, 3-fold CV, F1-macro, subsample 150k).
      - Optuna XGB: F1m CV 0.616 → 0.7005 (+8.4pp). LGBM: 0.670 → 0.7256 (+5.5pp).
      - treinamento_modelo.py: _build_meta_learner(kind) suporta "lr"/"gbm"/"lgbm"; novos modelos ensemble_stacking_gbm e ensemble_stacking_lgbm.
      - Stacking GBM (meta=GBM, base XGB/LGBM tunados): acc 84.61% (+1.01pp), F1m 0.7995 (+1.03pp), F1-Moderado 0.6296 (+1.28pp).
      - Re-threshold sobre ensemble_stacking_gbm: F1-Moderado 0.6375 (thr_mod=0.35, thr_alto=0.45).
      - app_map_interativo.py: carregar_modelo() agora prefere ensemble_stacking_gbm; dropdown front-end também.
      - Δ acumulado vs Stacking pré-Tier 1: +4.12pp acc, +5.03pp F1m, +8.77pp F1-Moderado.
  decisao_optuna_lr_2026_04_21: |
    Optuna LogisticRegression balanced (15 trials, 3-fold CV, base_de_dados_com_historico.csv, accuracy):
      - Best CV: 0.6456 (Trial 3); params: C=12.43, max_iter=4768.
      - Ganho marginal sobre defaults (~0.02 pp); LR é o baseline interpretável, não o melhor modelo.
      - Aplicado em MODEL_LIBRARY_IMPROVED['logistic_regression_balanced'] e em _estimador_lr_balanced().
      - Registro em modelos/relatorios/optuna_logistic_regression_balanced.json. Fecha §7 do checklist.
  decisao_rigor_metodologico_2026_05_12: |
    Rigor metodológico adicional (§13 do checklist) — versão final:
      a) SHAP global por classe — adoção do MODELO PROXY: scripts/analise_shap_rf_leve.py treina um RF
         compacto (n_estimators=100, max_depth=12, 60 000 amostras, acc in-sample 71.75%) e roda
         shap.TreeExplainer em 500 amostras. Saída em modelos/relatorios/shap_per_class.json. Permite que
         explainer.py use importâncias específicas da classe predita em vez da aproximação
         importância_global × z-score × sinal_físico. Defendido por Lundberg et al. 2020 (Nat. Mach. Intell.).
         Top-3 por classe: Baixo (Ano, KBDI_proxy, VPD_proxy); Moderado (KBDI_proxy, VPD_proxy, Indice_Seca);
         Muito Alto (KBDI_proxy, Ano, FRP).
      b) Validação temporal rolling-origin — scripts/validacao_temporal.py executado em RF balanced Tier 1
         (subsample 120k/fold) e em ensemble_stacking_gbm (subsample 60k/fold). Saídas em
         validacao_temporal.json e validacao_temporal_stacking_gbm.json.
         RF: acc=70.09% ± 4.10, F1m=0.592, F1-Mod=0.264 — Δ vs aleatório: -12.83pp acc, -35.65pp F1-Mod.
         Stacking GBM: acc=70.13% ± 4.06, F1m=0.606, F1-Mod=0.306 — Δ vs aleatório: -14.49pp acc, -32.35pp F1-Mod.
         Stacking mantém vantagem (+1.4pp F1m, +4.2pp F1-Mod) sobre RF mesmo sob folds temporais.
      c) Permutation Importance estratificada por classe (NOVO) — scripts/permutation_importance_por_classe.py
         aplica Breiman 2001 / Fisher et al. 2019 diretamente sobre ensemble_stacking_gbm (5 000 amostras
         de teste, 3 repetições). Saída em modelos/relatorios/permutation_importance_por_classe.json.
         Top-10 Δ F1-macro global: Ano (0.0351), Latitude (0.0318), Longitude (0.0258), Estado (0.0179),
         DiaSemChuva_ma90 (0.0104), FRP (0.0100). VPD_proxy aparece no Top-5 de Muito Alto também aqui
         (achado robusto entre as duas técnicas independentes de interpretabilidade).
      d) Pseudo-labeling de Umidade (NOVO) — scripts/pseudo_label_umidade.py treina LGBMRegressor sobre os
         ~170k registros com Umidade NASA POWER e imputa os ~763k sem label (RMSE=4.33%RH, MAE=3.19%RH,
         R²=0.933 em holdout 20%). Cobertura final 100%. Saída: base_de_dados_umidade_pseudo.csv com
         coluna auxiliar Umidade_origem; modelos/lgbm_regressor_umidade.pkl; relatório em
         modelos/relatorios/pseudo_label_umidade.json. Adoção no Stacking final fica como trabalho futuro
         imediato.
      Documentação: DOCUMENTO_METODOLOGIA_E_RESULTADOS.md §3.5.1, §3.12.2, §4.4.1, §4.4.2 (NOVO),
      §4.7.1 (NOVO), §4.11 e §4.11.1 (NOVO).

phases:
  - id: estado_ref
    name: "Estado de referência"
    parallel_while_enrichment: true
  - id: enriquecimento_umidade
    name: "Enriquecimento NASA umidade"
    parallel_while_enrichment: false
    blocking: false  # 2026-05-10: dessensibilizado — Tier 1 substitui no curto prazo
  - id: features_historico
    name: "Histórico de incêndios + carregar_dados"
    parallel_while_enrichment: true
  - id: modelos
    name: "Ensemble, avaliação, Optuna opcional"
    parallel_while_enrichment: true
  - id: features_temporais
    name: "Features temporais avançadas (ma7)"
    parallel_while_enrichment: true
  - id: tier1_features_avancadas
    name: "Tier 1 — Features físico-climáticas (substituição da umidade)"
    parallel_while_enrichment: true
  - id: pos_umidade
    name: "Integração Umidade + retreino final (opcional após Tier 1)"
    depends_on: [enriquecimento_umidade]
  - id: clima_extra
    name: "Enriquecimento climático extra (opcional)"
    depends_on: [enriquecimento_umidade]
  - id: mapa_app
    name: "Mapa e Flask"
    parallel_while_enrichment: true
  - id: app_explicavel
    name: "App interativo explicável (UI/UX + lookup Tier 1 + explainer)"
    depends_on: [tier1_features_avancadas, mapa_app]
  - id: rigor_metodologico
    name: "Rigor metodológico (SHAP per class, validação temporal)"
    depends_on: [tier1_features_avancadas, modelos]
  - id: documentacao
    name: "Documentação e fechamento"
    depends_on: [tier1_features_avancadas, mapa_app, app_explicavel, rigor_metodologico]

